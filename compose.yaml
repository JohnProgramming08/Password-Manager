services:
  flask_app:
    container_name: "flask_app"
    build: .
    ports:
      - 8000:8000
    volumes:
      - flask_vol:/users
    depends_on:
      postgres_db:
        condition: service_healthy

  postgres_db:
    container_name: "postgres_db"
    image: "postgres:16"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    volumes:
      - postgres_vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

volumes:
  postgres_vol:
  flask_vol: